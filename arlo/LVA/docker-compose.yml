services:
  # Fix permissions service (Keep as is)
  fix-permissions:
    platform: "linux/arm64"
    image: "ghcr.io/ohf-voice/linux-voice-assistant:latest"
    user: "0:0"
    entrypoint: []
    command: "chown -R 1000:1000 /app/local /app/configuration /app/wakewords/custom /app/sounds/custom"
    volumes:
      - wakeword_data:/app/local
      - wakeword_custom:/app/wakewords/custom
      - configuration:/app/configuration
      - sounds_custom:/app/sounds/custom
    restart: "no"

  # Linux Voice Assistant
  linux-voice-assistant:
    container_name: linux-voice-assistant
    platform: "linux/arm64"
    image: "ghcr.io/ohf-voice/linux-voice-assistant:latest"
    init: true
    restart: unless-stopped
    network_mode: "host"
    user: "1000:1000"
    group_add:
      - "29"  # audio group GID
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      - LVA_SOUNDCARD_BACKEND=alsa
      - AUDIO_INPUT_DEVICE=hw:2,0
      - AUDIO_OUTPUT_DEVICE=hw:2,0
      # Give PulseAudio a writable runtime dir so the startup script can proceed
      # Standard PulseAudio runtime path — the startup script is hardcoded to this location
      - XDG_RUNTIME_DIR=/run/user/1000
    cap_add:
      - SYS_NICE
    devices:
      - /dev/snd:/dev/snd
    tmpfs:
      - /run/user/1000:mode=0700,uid=1000,gid=1000
    volumes:
      - wakeword_data:/app/local
      - wakeword_custom:/app/wakewords/custom
      - configuration:/app/configuration
      - sounds_custom:/app/sounds/custom
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      fix-permissions:
        condition: service_completed_successfully

volumes:
  wakeword_data:
  wakeword_custom:
  configuration:
  sounds_custom: