---
services:
  # Fix permissions for wakeword_data and configuration volume
  fix-permissions:
    platform: "${DOCKER_PLATFORM:-linux/arm64}"
    image: "ghcr.io/ohf-voice/linux-voice-assistant:latest"
    user: "0:0"
    entrypoint: []
    command: "chown -R ${LVA_USER_ID:-1000}:${LVA_USER_GROUP:-1000} /app/local /app/configuration /app/wakewords/custom /app/sounds/custom"
    environment:
      # Pulseaudio
      # - XDG_RUNTIME_DIR=${LVA_XDG_RUNTIME_DIR:-/run/user/1000}
      # - PULSE_SERVER=${LVA_PULSE_SERVER:-/run/user/1000/pulse/native}
      # - PULSE_COOKIE=${LVA_PULSE_COOKIE:-/run/user/1000/pulse/cookie}
      # ALSA Configuration - ADD THESE TWO LINES:
      - AUDIO_INPUT_DEVICE=${AUDIO_INPUT_DEVICE:-default}
      - AUDIO_OUTPUT_DEVICE=${AUDIO_OUTPUT_DEVICE:-default}
      - SOUNDCARD_BACKEND=${LVA_SOUNDCARD_BACKEND:-alsa}
    env_file: ${ENV_FILE:-.env}
    group_add:
      - audio
    devices:
      - /dev/snd:/dev/snd
    volumes:
      # Wakeword data and configuration
      - wakeword_data:/app/local
      - wakeword_custom:/app/wakewords/custom
      - configuration:/app/configuration
      - sounds_custom:/app/sounds/custom
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: "no"

  # Linux Voice Assistant
  # Linux Voice Assistant
  linux-voice-assistant:
    container_name: linux-voice-assistant
    platform: "linux/arm64"
    image: "ghcr.io/ohf-voice/linux-voice-assistant:latest"
    init: true
    restart: unless-stopped
    network_mode: "host"
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    environment:
      # Only use ALSA for AnnoGrid nodes
      - SOUNDCARD_BACKEND=alsa
      - AUDIO_INPUT_DEVICE=hw:2,0
      - AUDIO_OUTPUT_DEVICE=hw:2,0
    cap_add:
      - SYS_NICE
    devices:
      - /dev/snd:/dev/snd
    stop_grace_period: 20s
    ulimits:
      rtprio: 95
      memlock: -1
    volumes:
      - wakeword_data:/app/local
      - wakeword_custom:/app/wakewords/custom
      - configuration:/app/configuration
      - sounds_custom:/app/sounds/custom
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      fix-permissions:
        condition: service_completed_successfully


volumes:
  wakeword_data:
  wakeword_custom:
  configuration:
  sounds_custom:
