version: '3.8'

# Gateway & Monitoring Node (anno-gw-mon-rpi3bp-01)
# Raspberry Pi 3B+
# Purpose: Central hub for monitoring, alerting, VPN, and tunneling

services:
  # Node Exporter - Local metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: always
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - annogrid-net
    labels:
      - "com.annogrid.component=monitoring"
      - "com.annogrid.node=anno-gw-mon-rpi3bp-01"

  # Prometheus - Metrics collection & storage
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus-config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-config/rules/:/etc/prometheus/rules/:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - annogrid-net
    labels:
      - "com.annogrid.component=monitoring"
      - "com.annogrid.node=anno-gw-mon-rpi3bp-01"

  # Grafana - Visualization & dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - TZ=UTC
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - annogrid-net
    labels:
      - "com.annogrid.component=monitoring"
      - "com.annogrid.node=anno-gw-mon-rpi3bp-01"

  # Alert Manager - Alert routing & notifications
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: always
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager-config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - annogrid-net
    labels:
      - "com.annogrid.component=monitoring"
      - "com.annogrid.node=anno-gw-mon-rpi3bp-01"

  # Optional: Loki - Log aggregation
  # loki:
  #   image: grafana/loki:latest
  #   container_name: loki
  #   restart: always
  #   ports:
  #     - "3100:3100"
  #   volumes:
  #     - ./loki-config/loki-config.yml:/etc/loki/local-config.yml:ro
  #     - loki-data:/loki
  #   command: -config.file=/etc/loki/local-config.yml
  #   networks:
  #     - annogrid-net

networks:
  annogrid-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local
