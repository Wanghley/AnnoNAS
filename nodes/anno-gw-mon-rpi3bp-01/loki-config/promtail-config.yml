server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://100.101.178.87:3100/loki/api/v1/push
    external_labels:
      dataset: ${APP_NAME}
      host: ${GATEWAY_ID}

scrape_configs:
  - job_name: system
    static_configs:
    - targets:
        - localhost
      labels:
        job: varlogs
        __path__: /var/log/*log
