global:
  scrape_interval: 15s
  external_labels:
    dataset: ${APP_NAME}
    host: ${GATEWAY_ID}

scrape_configs:
  - job_name: 'monitoring-node'
    static_configs:
      - targets: ['host.docker.internal:9100'] # node-exporter on host
        labels:
          nodename: ${GATEWAY_ID} # This makes it match your other nodes
      - targets: ['netdata:19999'] # Netdata is in a container, so this still works
        labels:
          nodename: ${GATEWAY_ID}

  - job_name: 'cluster-nodes'
    static_configs:
      - targets:
          - '100.71.104.20:9100'
          - '100.123.183.36:9100'
          - '100.114.225.52:9100'

remote_write:
  - url: "${CENTRAL_PROM_URL}"
    basic_auth:
      username: "${CENTRAL_PROM_USER}"
      password: "${CENTRAL_PROM_TOKEN}"
