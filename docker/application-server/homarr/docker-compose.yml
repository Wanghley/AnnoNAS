name: homarr

networks:
  annogrid:
    external: true

volumes:
  homarr_data:
    name: homarr_data

services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: annogrid-homarr
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SECRET_ENCRYPTION_KEY: ${HOMARR_SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/homarr
      TZ: ${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - homarr_data:/appdata
    ports:
      - "7575:7575"
    networks:
      - annogrid
    labels:
      homepage.group: anno-app
      homepage.name: Homarr
      homepage.icon: homarr.png
      homepage.href: "http://100.67.194.10:7575"
      homepage.description: Alt homelab dashboard
      homepage.server: anno-app
      homepage.container: annogrid-homarr
