# n8n with external task runner
# Requires: a running 'postgres' service on the 'databases_default' network
# Tested with n8n 2.20.9 (current stable as of May 2026)

x-shared-env: &shared-env
  # Must match exactly between n8n and n8n-runner
  N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      <<: *shared-env

      # ---- Database ----
      DB_TYPE: ${DB_TYPE}
      DB_POSTGRESDB_HOST: ${DB_POSTGRESDB_HOST}
      DB_POSTGRESDB_PORT: ${DB_POSTGRESDB_PORT}
      DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE}
      DB_POSTGRESDB_USER: ${DB_POSTGRESDB_USER}
      DB_POSTGRESDB_PASSWORD: ${DB_POSTGRES_PASSWORD}

      # ---- Core n8n ----
      N8N_HOST: n8n.wanghley.com
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      WEBHOOK_URL: https://n8n.wanghley.com/
      N8N_PROXY_HOPS: 1
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      

      # ---- Storage ----
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem

      # ---- Task runners (external mode) ----
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_BROKER_PORT: 5679

      # ---- Timezone (Durham NC) ----
      GENERIC_TIMEZONE: America/New_York
      TZ: America/New_York

      # ---- Performance ----
      # Heap ~75% of container limit. 1.5GB heap → 2GB mem_limit
      NODE_OPTIONS: --max-old-space-size=1536
      NODE_ENV: production
      NODE_FUNCTION_ALLOW_BUILTIN: buffer
      N8N_RELEASE_TYPE: stable
      NPM_CONFIG_UPDATE_NOTIFIER: "false"

      # ---- Optional hardening ----
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_SECURE_COOKIE: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_storage:/home/node/.n8n
    #networks:
    #  - databases_default
    expose:
      - "5679"  # task broker, internal only
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  n8n-runner:
    # NOTE: this is the runners image, NOT the main n8n image.
    # Version MUST match the n8n service above, exactly.
    image: n8nio/runners:stable
    container_name: n8n-runner
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      <<: *shared-env
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      NODE_OPTIONS: --max-old-space-size=512
      NODE_ENV: production
    #networks:
    #  - databases_default
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  n8n_storage:
    name: N8n-n8n_storage
    external: false   # set to false if you want compose to create it fresh

#networks:
#  databases_default:
#    external: true
