networks:
  annogrid:
    external: true

services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: annogrid-node-exporter
    restart: unless-stopped
    pid: "host"
    volumes:
      - '/:/host:ro,rslave'
      - '/proc:/host/proc:ro'
      - '/sys:/host/sys:ro'
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containerd/.+)($$|/)'
    networks:
      - annogrid

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: annogrid-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    networks:
      - annogrid

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: annogrid-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    networks:
      - annogrid

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: annogrid-mysqld-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mariadb:3306)/"
    command:
      - "--config.my-cnf="
    networks:
      - annogrid
