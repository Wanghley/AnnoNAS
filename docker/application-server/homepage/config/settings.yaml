title: AnnoGrid
language: en
theme: dark
color: zinc
target: _self
headerStyle: boxed
statusStyle: "dot"
hideVersion: true
disableCollapse: true

favicon: /icons/favicon.png
background:
    image: /images/background.png

layout:
  # ── HOME Tab ─────────────────────────────────────────────────────
  Media:
      style: column
      tab: HOME
      icon: mdi-multimedia
  Automation:
      style: column
      tab: HOME
      icon: mdi-robot-outline
  AI:
      style: column
      tab: HOME
      icon: mdi-brain
  Personal:
      style: column
      tab: HOME
      icon: mdi-account-outline
  Management:
      style: column
      tab: HOME
      icon: mdi-server
  Monitoring:
      style: column
      tab: HOME
      icon: mdi-chart-line
  _hidden0:
      style: column
      tab: HOME
  _hidden1:
      style: column
      tab: HOME

  # ── STAT Tab ─────────────────────────────────────────────────────
  anno-app Stats:
      style: column
      tab: STAT
      icon: mdi-chip
  anno-ai Stats:
      style: column
      tab: STAT
      icon: mdi-gpu
  anno-nas Stats:
      style: column
      tab: STAT
      icon: mdi-harddisk
  anno-gw Stats:
      style: column
      tab: STAT
      icon: mdi-router-network
  Jellyfin Movies:
      style: column
      tab: STAT
      icon: mdi-movie-roll
  Jellyfin Series:
      style: column
      tab: STAT
      icon: mdi-television-classic
  Cluster Containers:
      style: column
      tab: STAT
      icon: mdi-docker
  Cluster Health:
      style: column
      tab: STAT
      icon: mdi-heart-pulse
  System Alerts:
      style: column
      tab: STAT
      icon: mdi-bell-outline

  # ── INFRA Tab ────────────────────────────────────────────────────
  Databases:
      style: column
      tab: INFRA
      icon: mdi-database
  ⠀:
      style: column
      tab: INFRA
  ⠀⠀:
      style: column
      tab: INFRA
  ⠀⠀⠀:
      style: column
      tab: INFRA
  ⠀⠀⠀⠀:
      style: column
      tab: INFRA
  ⠀⠀⠀⠀⠀:
      style: column
      tab: INFRA
  AnnoGrid Resources:
      style: column
      tab: INFRA
      icon: mdi-home

  # ── LIVE Tab — auto-discovered per host via Docker labels ─────────────────
  anno-app:
      style: column
      tab: LIVE
      icon: mdi-server
  anno-ai:
      style: column
      tab: LIVE
      icon: mdi-gpu
  anno-gw:
      style: column
      tab: LIVE
      icon: mdi-router-network
  anno-nas:
      style: column
      tab: LIVE
      icon: mdi-harddisk
