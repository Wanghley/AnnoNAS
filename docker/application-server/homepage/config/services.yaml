# ── Media ────────────────────────────────────────────────────────────────────
- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: http://anno-app-opi3bp-01.local:8096
        description: Media server · anno-app
        server: anno-app
        container: annogrid-jellyfin
        widget:
          type: jellyfin
          url: http://annogrid-jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          enableBlocks: true
          enableNowPlaying: true

