networks:
  annogrid:
    external: true

volumes:
  postgres_data:
    name: annogrid_postgres_data
  mariadb_data:
    name: annogrid_mariadb_data
  redis_data:
    name: annogrid_redis_data
  mongodb_data:
    name: annogrid_mongodb_data

services:
  postgres:
    image: postgres:15-alpine
    container_name: annogrid-postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Using a direct file mapping for the init script is more reliable
      - ./configs/postgres/init-scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      annogrid:
        ipv4_address: 172.20.0.10
    labels:
      homepage.group: anno-app
      homepage.name: PostgreSQL
      homepage.icon: postgresql.png
      homepage.description: Primary SQL database
      homepage.server: anno-app
      homepage.container: annogrid-postgres
    healthcheck:
      # Use a simpler healthcheck that doesn't rely on complex shell logic
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  mariadb:
    image: mariadb:11-jammy
    container_name: annogrid-mariadb
    hostname: mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./configs/mariadb/init-scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      annogrid:
        ipv4_address: 172.20.0.11
    labels:
      homepage.group: anno-app
      homepage.name: MariaDB
      homepage.icon: mariadb.png
      homepage.description: Relational database
      homepage.server: anno-app
      homepage.container: annogrid-mariadb
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: annogrid-redis
    hostname: redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      annogrid:
        ipv4_address: 172.20.0.12
    labels:
      homepage.group: anno-app
      homepage.name: Redis
      homepage.icon: redis.png
      homepage.description: In-memory cache
      homepage.server: anno-app
      homepage.container: annogrid-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
