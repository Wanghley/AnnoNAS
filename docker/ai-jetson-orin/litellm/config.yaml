# ============================================================
# LiteLLM — anno-ai-jetson-orin-01 Complete Stack
# Durham NC: $0.14/kWh × 2.4 PUE = $0.33/kWh effective
# Cost: output = Watts / tok_s / 3_600_000 × $0.33
#        input  = output / 10
# Updated: May 2026
# ============================================================

# All models now live in Postgres (added via /model/new) instead of here —
# manage them in the Admin UI's "Models" tab. store_model_in_db (below) makes
# the proxy load them from the DB at startup and poll for changes.
model_list: []

# ============================================================
# LITELLM SETTINGS
# ============================================================
litellm_settings:
  num_retries: 3
  request_timeout: 300
  drop_params: true
  set_verbose: false
  json_logs: true

  fallbacks:
    - qwen3.5:4b:
        - qwen3.5:2b
        - llama3.2:latest
    - gemma4:e2b:
        - qwen3.5:4b
        - qwen3.5:2b
    - deepseek-r1:1.5b:
        - lfm2.5-thinking:latest
    - moondream:
        - qwen3.5:2b
    - hermes3:8b:
        - hermes3:3b
        - qwen3.5:4b

  context_window_fallbacks:
    - qwen3.5:4b:
        - qwen3.5:2b


# ============================================================
# ROUTER
# ============================================================
router_settings:
  routing_strategy: least-busy
  num_retries: 3
  retry_after: 5
  timeout: 300
  enable_pre_call_checks: true

  # Shared Redis (core-data stack on app server) so rate limits, budgets,
  # and router state are enforced globally instead of per worker
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD


# ============================================================
# GENERAL
# ============================================================
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  database_type: "postgres"
  store_model_in_db: true
  background_health_checks: true
  health_check_interval: 1800   # 30min — this box can only load 1 Ollama model at a time,
                                 # checking all ~17 every 60s just thrashes RAM for no benefit

  # ── Budget & Spend Tracking ─────────────────────────────────
  # Hard stop when total spend across ALL providers hits this (USD)
  max_budget: os.environ/LITELLM_MAX_BUDGET
  budget_duration: "1mo"      # resets on the 1st of each month
  disable_spend_logs: false   # keep every request in postgres for dashboards
  enforce_user_params: false
