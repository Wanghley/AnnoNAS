global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'nodename']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: telegram

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: ${TELEGRAM_CHAT_ID}
        parse_mode: 'Markdown'
        message: |
          {{ range .Alerts }}
          *{{ .Status | toUpper }}* — {{ .Labels.alertname }}
          Node: `{{ .Labels.nodename }}`
          {{ .Annotations.summary }}
          {{ end }}
