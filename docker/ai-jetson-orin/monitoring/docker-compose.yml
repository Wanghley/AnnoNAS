name: annogrid-monitoring-hub

services:

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-hub
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-remote-write-receiver'
    labels:
      homepage.group: anno-ai
      homepage.name: Prometheus
      homepage.icon: prometheus.png
      homepage.href: "http://100.85.193.50:9090"
      homepage.description: Metrics collection hub
      homepage.server: anno-ai
      homepage.container: prometheus-hub

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
    env_file: .env
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    labels:
      homepage.group: anno-ai
      homepage.name: Alertmanager
      homepage.icon: alertmanager.png
      homepage.href: "http://100.85.193.50:9093"
      homepage.description: Alert routing & silencing
      homepage.server: anno-ai
      homepage.container: alertmanager

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter-orin
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    command:
      - '--path.rootfs=/host'
      - '--web.listen-address=0.0.0.0:9100'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containerd/.+)($$|/)'
      - '--collector.netdev.device-exclude=^(lo|docker[0-9]+|br-.+|veth.+)$$'
    labels:
      homepage.group: anno-ai
      homepage.name: Node Exporter
      homepage.icon: mdi-server-network
      homepage.description: Host metrics exporter
      homepage.server: anno-ai
      homepage.container: node-exporter-orin

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor-orin
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    labels:
      homepage.group: anno-ai
      homepage.name: cAdvisor
      homepage.icon: mdi-docker
      homepage.href: "http://100.85.193.50:8081"
      homepage.description: Container resource metrics
      homepage.server: anno-ai
      homepage.container: cadvisor-orin

  topology-exporter:
    build: ./topology-exporter
    container_name: topology-exporter
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - ./nodes.yml:/etc/topology/nodes.yml:ro
    labels:
      homepage.group: anno-ai
      homepage.name: Topology Exporter
      homepage.icon: mdi-map-marker-path
      homepage.description: Cluster topology metrics
      homepage.server: anno-ai
      homepage.container: topology-exporter

  docker-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      SERVICES: 1
      TASKS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "2375:2375"
    read_only: true
    tmpfs:
      - /run

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=${DB_HOST}
      - GF_DATABASE_NAME=${DB_NAME}
      - GF_DATABASE_USER=${DB_USER}
      - GF_DATABASE_PASSWORD=${DB_PASSWORD}
      - GF_DATABASE_SSL_MODE=disable
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    env_file: .env
    depends_on:
      - prometheus
    labels:
      homepage.group: anno-ai
      homepage.name: Grafana
      homepage.icon: grafana.png
      homepage.href: "http://100.85.193.50:3001"
      homepage.description: Metrics dashboards
      homepage.server: anno-ai
      homepage.container: grafana

volumes:
  prometheus-data:
