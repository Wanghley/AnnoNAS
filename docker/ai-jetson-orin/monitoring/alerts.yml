groups:
  - name: annogrid
    rules:
      - alert: NodeDown
        expr: up{job=~"orin|app-server|gateway|nas"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.nodename }} is unreachable"

      - alert: HighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.nodename }} memory above 85%"

      - alert: HighDisk
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.nodename }} disk above 85%"

      - alert: ContainerDown
        expr: time() - container_last_seen > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} on {{ $labels.nodename }} may be down"
