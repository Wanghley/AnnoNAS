# AnnoGrid topology node configuration
# Each key is the node's unique ID (used in Prometheus labels and edge matching).
#
# Fields:
#   user      — SSH user on that host
#   ip        — Tailscale (or LAN) IP the exporter SSHes into
#   arc_role  — color group in Grafana; pick from the palette below or add your own
#               (adding a NEW arc_role requires: edit this file + restart topology-exporter)
#               (adding a host with an EXISTING arc_role: just edit this file, auto-discovered in ~30s)
#   display   — short name shown on the host node in the graph
#
# Arc role color palette (defined in grafana/provisioning/dashboards/topology.json):
#   host     → gray    #aaaaaa  (physical host nodes — always used for host markers)
#   opi3b    → blue    #5794F2
#   nas      → green   #73BF69
#   gateway  → orange  #FF9830
#   orin     → purple  #B877D9
#   rpi4     → yellow  #FADE2A
#   rpi5     → red     #F2495C
#   x86      → teal    #64B0EB

hosts:
  anno-app-opi3b-01:
    user: orangepi
    ip: 100.67.194.10
    arc_role: opi3b
    display: OPi3B

  anno-nas-rpi3b-01:
    user: wanghley
    ip: 100.114.225.52
    arc_role: nas
    display: NAS

  anno-gw-mon-rpi3b-01:
    user: wanghley
    ip: 100.101.178.87
    arc_role: gateway
    display: Gateway

  anno-ai-jetson-orin-01:
    user: wanghley
    ip: 100.85.193.50
    arc_role: orin
    display: Orin Hub
