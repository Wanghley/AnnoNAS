services:
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped
    command: gateway run
    ports:
      - "${HERMES_API_PORT:-8642}:8642"
      - "${HERMES_DASHBOARD_PORT:-9119}:9119"
    env_file: .env
    environment:
      - HERMES_DASHBOARD=1
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
    volumes:
      - ./data:/opt/data
    networks:
      - litellm_default
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    labels:
      homepage.group: anno-ai
      homepage.name: Hermes Agent
      homepage.icon: hermes.png
      homepage.href: "http://100.85.193.50:${HERMES_DASHBOARD_PORT:-9119}"
      homepage.description: Nous Hermes tool-use agent
      homepage.server: anno-ai
      homepage.container: hermes-agent

networks:
  litellm_default:
    external: true
